name: Build remote firmware

on:
  push:
    paths:
      - "remote/**"
      - "webconfig/**"
      - ".github/workflows/build-remote.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-6.1.19-${{ runner.os }}-${{ hashFiles('remote/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"

      - name: Build
        working-directory: remote
        # The first build rebuilds the IDF libs (custom_sdkconfig) and swaps in a
        # newer SCons mid-run, which can fail once; a second pass then succeeds.
        run: pio run -e openremote_rev5 || pio run -e openremote_rev5

      - name: Collect firmware
        run: |
          mkdir -p out
          cp remote/.pio/build/openremote_rev5/firmware.bin "out/OpenRemote-Remote-Firmware-${GITHUB_SHA::7}.bin"
          cp remote/.pio/build/openremote_rev5/firmware.elf "out/OpenRemote-Remote-Firmware-${GITHUB_SHA::7}.elf"
          cp "webconfig/WebConfig 3.50.html" "out/OpenRemote-WebConfig-3.50-${GITHUB_SHA::7}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: openremote-remote-firmware
          path: out/
